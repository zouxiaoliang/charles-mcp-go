name: test-and-build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/charles-mcp
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: charles-mcp-binaries
          path: dist/*
